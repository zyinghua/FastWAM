train:
  _target_: fastwam.datasets.lerobot3.robot_video_dataset.RobotVideoDataset
  # Read LeRobot v3 aggregate Parquet/MP4 files directly, without conversion.
  dataset_dirs:
    - ${oc.env:G1_DATA_ROOT,/Omni-G1/data/self_collected/g1_pnp_pour_v3}
  shape_meta:
    images:
      - key: egocentric
        lerobot_key: observation.images.egocentric
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
    state:
      - key: default
        lerobot_key: states
        raw_shape: 43
        shape: 43
    action:
      # SONIC layout: [motion token 64, left hand 7, right hand 7].
      - key: default
        lerobot_key: action
        raw_shape: 78
        shape: 78

  # Preserve FastWAM's default: 33 observations and 32 action targets.
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 1
  # Resize to 240x320, then crop to dimensions divisible by 32 for Wan.
  video_size: [224, 320]
  camera_key: null
  concat_multi_camera: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: false

  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 78
    proprio_output_dim: 43
    # Motion tokens and hands are already action targets; do not subtract state.
    delta_action_dim_mask: null
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]

  # The wrappers run from the repo root; generated caches stay outside the data.
  text_embedding_cache_dir: ${oc.env:G1_TEXT_CACHE,./artifacts/g1_pnp_pour_v3/text_embeds_cache}
  use_text_embed_cache: true
  context_len: 128
  video_backend: pyav
