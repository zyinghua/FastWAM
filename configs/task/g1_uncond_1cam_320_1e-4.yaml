# @package _global_

defaults:
  - override /data: g1_lerobot_v3
  - override /model: fastwam
  - _self_

batch_size: 4
num_workers: 4

data:
  train:
    num_frames: 33
  val: null

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 5
max_steps: 3000
log_every: 10
save_every: 1000
eval_every: 0
eval_num_inference_steps: 10

gradient_accumulation_steps: 6
weight_decay: 1e-2
resume: null

wandb:
  enabled: true
  mode: online
