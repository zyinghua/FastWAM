# @package _global_

defaults:
  - override /data: robotwin_selected_tasks
  - override /model: fastwam
  - _self_

# Eight-GPU baseline matching RollingWAM's selected-six-task training budget.
# Effective batch size: 8 samples/GPU x 8 GPUs x 2 accumulation steps = 128.
# For four GPUs, use the corresponding _4gpu task preset.
batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: false
  # Retain fastwam.yaml's pretrained video expert and interpolated 1024-d ActionDiT.
  # The native FastWAM horizon remains 32 actions (data.train.num_frames = 33).

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 4
max_steps: null
log_every: 10
save_every: 200
eval_every: 200

# training
gradient_accumulation_steps: 2
weight_decay: 1e-2
resume: null
